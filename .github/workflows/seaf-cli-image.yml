name: seaf-cli image

on:
  push:
    branches: [main]
    paths:
      - synology-seaf-cli/Dockerfile
      - synology-seaf-cli/entrypoint.py
      - synology-seaf-cli/seaf-entrypoint.py
      # Verification input: a test-only change should still run CI (the lint job
      # runs test_entrypoint.py). Rebuilds an identical runtime image — harmless.
      - synology-seaf-cli/test_entrypoint.py
  workflow_dispatch:

# §27: don't let an obsolete build hold up a newer commit on the same ref.
concurrency:
  group: seaf-cli-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pyflakes
      - run: |
          python -m pyflakes synology-seaf-cli/entrypoint.py
          python -m pyflakes synology-seaf-cli/seaf-entrypoint.py
      # Verify the command dispatcher (seafile module + seaf-cli are stubbed).
      - run: python synology-seaf-cli/test_entrypoint.py

  build-push:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      # buildx container driver — required for the type=gha cache export below.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: synology-seaf-cli
          push: true
          # §6.2/§18: mutable pointer for normal deploys + immutable commit tag
          # for audit and §6.3 rollback (redeploy a prior sha- tag on the NAS).
          tags: |
            ghcr.io/u2giants/seafile:seaf-cli-latest
            ghcr.io/u2giants/seafile:sha-${{ github.sha }}
          # §27: reuse layers across builds; still produces a fresh image.
          cache-from: type=gha
          cache-to: type=gha,mode=max
