name: nas-settings test

# The nas-settings panel is deployed manually on the VPS (not part of any image),
# so this workflow only lints + tests it — it never builds or deploys.
on:
  push:
    branches: [main]
    paths:
      - seafile-server/nas-settings/**
  workflow_dispatch:

concurrency:
  group: nas-settings-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install flask pyflakes
      - run: python -m pyflakes seafile-server/nas-settings/app.py
      # Drives the Flask test client through the command/status queue + templates.
      - run: python seafile-server/nas-settings/test_app.py
