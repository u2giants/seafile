<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAS Sync Settings — Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a2a4a;
      color: #fff;
      padding: 18px 32px;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.10);
      padding: 40px 36px 36px;
      width: 100%;
      max-width: 380px;
    }

    .card h1 {
      font-size: 1.3rem;
      color: #1a2a4a;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .card p.subtitle {
      color: #6b7280;
      font-size: 0.875rem;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 1rem;
      color: #111827;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="password"]:focus {
      border-color: #1a2a4a;
      box-shadow: 0 0 0 3px rgba(26, 42, 74, 0.12);
    }

    .error {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 6px;
      color: #b91c1c;
      font-size: 0.875rem;
      padding: 10px 14px;
      margin-bottom: 20px;
    }

    button[type="submit"] {
      display: block;
      width: 100%;
      margin-top: 22px;
      padding: 11px;
      background: #1a2a4a;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button[type="submit"]:hover {
      background: #243d6b;
    }
  </style>
</head>
<body>
  <header>NAS Sync Settings &mdash; POP Creations</header>
  <main>
    <div class="card">
      <h1>Sign In</h1>
      <p class="subtitle">Enter your password to manage sync settings.</p>

      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}

      <form method="post" action="{{ url_for('login') }}">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autofocus autocomplete="current-password" required />
        <button type="submit">Sign in</button>
      </form>
    </div>
  </main>
</body>
</html>
