# Synology NAS — Seafile seaf-cli sync containers
# One service per library. Each syncs a NAS folder to a Seafile library.
#
# Image: flrnnc/seafile-client (flowgunso/seafile-client is deprecated alias)
# Env vars: SEAF_SERVER_URL, SEAF_USERNAME, SEAF_PASSWORD, SEAF_LIBRARY
#
# Deploy: docker compose -f /tmp/seaf-cli-compose.yml up -d
# (compose runs from /tmp on the NAS; volume name prefix will be "tmp_")
#
# seaf-cli-decor is LIVE on edgesynology1 as of 2026-05-08.
# NAS paths for Assets and Seasonal are not yet confirmed — verify before adding.

services:

  seaf-cli-decor:
    image: flrnnc/seafile-client:latest
    container_name: seaf-cli-decor
    restart: unless-stopped
    volumes:
      - /volume1/mac/Decor:/data/sync
      - seaf-cli-decor-data:/root/.seafile-client
    environment:
      - SEAF_SERVER_URL=https://seafile.designflow.app
      - SEAF_USERNAME=nas-sync@popcre.com
      - SEAF_PASSWORD=${NAS_SYNC_PASSWORD}
      - SEAF_LIBRARY=0dee1650-878e-4ca3-9533-e3876ebd4c1e

  # seaf-cli-assets:
