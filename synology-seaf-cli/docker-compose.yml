# Synology NAS — Seafile seaf-cli sync containers
# One service per library. Each syncs a NAS folder to a Seafile library.
#
# Image: flrnnc/seafile-client (flowgunso/seafile-client is a deprecated alias)
# Env vars: SEAF_SERVER_URL, SEAF_USERNAME, SEAF_PASSWORD, SEAF_LIBRARY (UUID)
#
# Deploy on edgesynology1:
#   Write this file to /tmp/seaf-cli-compose.yml (via base64+tee through NAS MCP)
#   docker-compose -f /tmp/seaf-cli-compose.yml up -d
#   (volume name prefix will be "tmp_" since compose runs from /tmp)
#
# Both containers LIVE on edgesynology1 as of 2026-05-08.

services:

  seaf-cli-char-licensed:
    image: flrnnc/seafile-client:latest
    container_name: seaf-cli-char-licensed
    restart: unless-stopped
    volumes:
      - /volume1/mac/Decor/Character Licensed:/library
      - seaf-cli-char-licensed-data:/seafile
    environment:
      - SEAF_SERVER_URL=https://seafile.designflow.app
      - SEAF_USERNAME=nas-sync@popcre.com
      - SEAF_PASSWORD=${NAS_SYNC_PASSWORD}
      - SEAF_LIBRARY=177cf9de-3066-482e-956a-7ae8d8786c6d

  seaf-cli-generic-decor:
    image: flrnnc/seafile-client:latest
    container_name: seaf-cli-generic-decor
    restart: unless-stopped
    volumes:
      - /volume1/mac/Decor/Generic Decor:/library
      - seaf-cli-generic-decor-data:/seafile
    environment:
      - SEAF_SERVER_URL=https://seafile.designflow.app
      - SEAF_USERNAME=nas-sync@popcre.com
      - SEAF_PASSWORD=${NAS_SYNC_PASSWORD}
      - SEAF_LIBRARY=1b116ab7-d66b-4411-a691-21f34eadb731

volumes:
  seaf-cli-char-licensed-data:
  seaf-cli-generic-decor-data:
